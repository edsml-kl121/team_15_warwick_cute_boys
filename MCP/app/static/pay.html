<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopeePay Simulator · Confirm</title>
<style>
  :root { --brand: #ee4d2d; --ink: #222; --muted: #888; --line: #efefef; --bg: #f5f5f5; --key: #d2d5db; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 14px/1.4 -apple-system, "Helvetica Neue", Roboto, sans-serif; background: #e9e9e9; color: var(--ink); }
  .phone { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
  .bar { height: 52px; background: #fff; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; border-bottom: 1px solid var(--line); }
  .bar a { color: var(--brand); font-size: 28px; text-decoration: none; text-align: center; }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 500; text-align: center; }
  .merchant { background: #fff; text-align: center; padding: 24px 16px 20px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--line); display: block; margin: 0 auto 8px; }
  .merchant .name { font-weight: 500; }
  .merchant .label { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .amount { color: var(--brand); font-size: 34px; font-weight: 500; letter-spacing: -.5px; }
  .amount small { font-size: 18px; margin-right: 2px; }
  .card { background: #fff; margin-top: 10px; padding: 4px 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); }
  .row.total .v { color: var(--brand); font-weight: 600; }
  .method { display: flex; align-items: center; gap: 8px; }
  .sp { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .pin { background: #fff; margin-top: 10px; padding: 18px 16px 14px; text-align: center; }
  .pin .t { font-size: 15px; margin-bottom: 14px; }
  .boxes { display: inline-grid; grid-template-columns: repeat(6, 44px); border: 1px solid #ccc; border-radius: 4px; overflow: hidden; }
  .boxes div { height: 44px; display: grid; place-items: center; border-right: 1px solid #ccc; font-size: 22px; }
  .boxes div:last-child { border-right: 0; }
  .msg { min-height: 20px; margin-top: 10px; color: var(--brand); font-size: 13px; }
  .forgot { color: #05a; font-size: 13px; }
  .spacer { flex: 1; }
  .pad { background: var(--key); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 6px 22px; }
  .pad button { height: 48px; border: 0; border-radius: 6px; background: #fff; font-size: 24px; box-shadow: 0 1px 0 #898a8d; color: var(--ink); cursor: pointer; }
  .pad button.fn { background: transparent; box-shadow: none; font-size: 15px; }
  .pad button:active { background: #bcc0c7; }
  .done { background: #fff; text-align: center; padding: 48px 16px 32px; }
  .tick { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; font-size: 34px; color: #fff; background: #26aa99; }
  .tick.bad { background: #bbb; }
  .cta { display: block; margin: 16px; padding: 12px; text-align: center; background: var(--brand); color: #fff; border-radius: 4px; text-decoration: none; font-size: 15px; }
  .sim { text-align: center; font-size: 11px; color: #a37b00; background: #fff8e1; padding: 3px; }
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><a href="/" aria-label="Back">‹</a><h1>ShopeePay</h1><span></span></div>
  <div id="app" class="spacer"><div class="merchant" style="color:#888">Loading…</div></div>
  <div class="sim">SIMULATOR · sandbox payment, no real money</div>
</div>
<script>
const intentId = location.pathname.split("/").pop();
const app = document.getElementById("app");
let pin = "";

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === "class" ? (n.className = v) : n.setAttribute(k, v)));
  kids.flat().forEach((k) => n.append(k instanceof Node ? k : document.createTextNode(String(k))));
  return n;
}
const money = (v) => Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function api(path, opts) {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await r.json();
  if (!r.ok) throw new Error(body.message || r.statusText);
  return body;
}

function finished(ok, title, sub, redirectUrl) {
  app.replaceChildren(el("div", { class: "done" }, el("div", { class: "tick" + (ok ? "" : " bad") }, ok ? "✓" : "✕"),
    el("div", { style: "font-size:18px;font-weight:500" }, title), el("div", { style: "color:#888;margin-top:6px" }, sub)),
    el("a", { class: "cta", href: redirectUrl || "/" }, redirectUrl ? "Back to Zippy" : "View my purchases"));
}

function approved(payment) {
  finished(true, "Payment successful", `฿${money(payment.amount_thb)} paid · order ${payment.order_id}`, payment.redirect_url);
}

async function render() {
  let p, w;
  try { [p, w] = await Promise.all([api(`/api/payments/${intentId}`), api("/api/wallet")]); }
  catch (e) { app.replaceChildren(el("div", { class: "merchant" }, e.message === "Failed to fetch" ? "Can't reach the simulator. Open http://localhost:8090" : e.message)); return; }
  if (p.status === "approved") return approved(p);
  if (p.status !== "pending") return finished(false, `Payment ${p.status}`, "No money was deducted.");

  const o = p.order;
  const shop = o.kind === "food" ? await api(`/api/restaurants/${o.shop_id}/menu`).catch(() => null) : null;
  const boxes = el("div", { class: "boxes" });
  const msg = el("div", { class: "msg" });
  const draw = () => boxes.replaceChildren(...[...Array(6)].map((_, i) => el("div", {}, i < pin.length ? "•" : "")));
  draw();

  let submitting = false;
  async function submit() {
    submitting = true;
    try {
      const payment = await api(`/api/payments/${intentId}/approve`, { method: "POST", body: JSON.stringify({ pin }) });
      pin = "";
      approved(payment);
    }
    catch (e) { pin = ""; draw(); msg.textContent = e.message; if (/declined/.test(e.message)) setTimeout(render, 1200); }
    finally { submitting = false; }
  }
  function press(k) {
    if (submitting) return;
    msg.textContent = "";
    if (k === "⌫") pin = pin.slice(0, -1);
    else if (k === "Cancel") return api(`/api/payments/${intentId}/decline`, { method: "POST" }).then(render);
    else if (pin.length < 6) pin += k;
    draw();
    if (pin.length === 6) submit();
  }
  const pad = el("div", { class: "pad" }, ...["1","2","3","4","5","6","7","8","9","Cancel","0","⌫"].map((k) =>
    el("button", { type: "button", class: k.length > 1 || k === "⌫" ? "fn" : "" }, k)));
  pad.addEventListener("click", (e) => e.target.tagName === "BUTTON" && press(e.target.textContent));

  const mallShops = [...new Set(o.items.map((item) => item.shop).filter(Boolean))];
  const merchantName = o.kind === "food" ? o.shop_name
    : mallShops.length === 1 ? `${mallShops[0]} · Shopee Mall` : "Shopee Mall";
  const avatar = shop ? el("img", { class: "avatar", src: shop.image_url, alt: "" }) : el("div", { class: "avatar" });
  const itemRows = o.items.map((i) => el("div", { class: "row" }, el("span", {}, `${i.name} ×${i.qty}`), el("span", {}, `฿${money(i.unit_price_thb * i.qty)}`)));

  app.replaceChildren(
    el("div", { class: "merchant" }, avatar, el("div", { class: "name" }, merchantName),
      el("div", { class: "label" }, "Payment amount"), el("div", { class: "amount" }, el("small", {}, "฿"), money(p.amount_thb))),
    el("div", { class: "card" },
      el("div", { class: "row" }, el("span", { class: "k" }, "Payment method"),
        el("span", { class: "method" }, el("span", { class: "sp" }, "S"), `Wallet (฿${money(w.balance_thb)})`)),
      ...itemRows,
      el("div", { class: "row" }, el("span", { class: "k" }, o.kind === "food" ? "Delivery fee" : "Shipping fee"), el("span", {}, `฿${money(o.delivery_fee_thb)}`)),
      el("div", { class: "row total" }, el("span", {}, "Total"), el("span", { class: "v" }, `฿${money(p.amount_thb)}`))),
    el("div", { class: "pin" }, el("div", { class: "t" }, "Enter your 6-digit ShopeePay PIN"), boxes, msg,
      el("div", { class: "forgot" }, "Use the PIN provided by your demo host.")),
    el("div", { class: "spacer" }),
    pad);
  app.style.display = "flex"; app.style.flexDirection = "column";
}
render();
</script>
</body>
</html>
