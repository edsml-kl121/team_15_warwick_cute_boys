[project]
name = "shopee-sim"
version = "0.1.0"
description = "Mock Shopee Food, Mall, and ShopeePay MCP server"
requires-python = ">=3.13"
dependencies = ["mcp==1.26.0", "uvicorn==0.41.0"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
