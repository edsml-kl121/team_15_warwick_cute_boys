services:
  frontend:
    build: ./FE
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backend:
    build: ./BE
    ports:
      - "127.0.0.1:8000:8000"

  mcp:
    build: ./MCP
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - backend
