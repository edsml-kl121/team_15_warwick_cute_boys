services:
  frontend:
    build: ./FE
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backend:
    build: ./BE
    environment:
      MONGO_URL: ${MONGO_URL:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-zippy}
    ports:
      - "127.0.0.1:8000:8000"

  mcp:
    build: ./MCP
    environment:
      PUBLIC_BASE_URL: http://localhost:8001
      SIM_RETURN_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8001:8001"
